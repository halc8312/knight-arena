name: keepalive
# Pings the Render free-tier WebSocket server so it never idles into sleep.
# (Render sleeps free web services after ~15min without traffic.)
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping game server health
        run: curl -fsS --max-time 20 https://knight-arena-server.onrender.com/health
