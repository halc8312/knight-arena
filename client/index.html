<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Knight Arena</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; background: #0b0e14; touch-action: none;
      font-family: -apple-system, system-ui, sans-serif; }
    #app { position: fixed; inset: 0; }
    canvas { display: block; }

    #hud { position: fixed; top: max(10px, env(safe-area-inset-top)); left: 12px; color: #cfd8e3;
      font-size: 13px; z-index: 10; text-shadow: 0 1px 3px #000; }
    #hud b { color: #6cf; }
    #conn { color: #e6b455; }

    #stick { position: fixed; left: 24px; bottom: max(28px, env(safe-area-inset-bottom));
      width: 120px; height: 120px; z-index: 10; }
    #stick .zone { width: 100%; height: 100%; }

    #join { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px;
      background: radial-gradient(ellipse at center, #16202e 0%, #0b0e14 75%); color: #e8eef5; }
    #join h1 { font-size: 28px; letter-spacing: 2px; }
    #join h1 span { color: #6cf; }
    #join input { font-size: 16px; padding: 10px 14px; border-radius: 8px; border: 1px solid #345;
      background: #101623; color: #fff; width: 240px; text-align: center; }
    #join button { font-size: 16px; padding: 12px 40px; border-radius: 8px; border: 0;
      background: linear-gradient(135deg, #3a9bdc, #2b6cb0); color: #fff; font-weight: 600; }
    #join button:active { transform: scale(0.97); }
    #join .hint { font-size: 12px; color: #8fa2b8; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="hud">Knight Arena — <b id="count">0</b> online <span id="conn"></span></div>
  <div id="stick"><div class="zone"></div></div>
  <div id="join">
    <h1>Knight <span>Arena</span></h1>
    <input id="name" maxlength="16" placeholder="名前（任意）" />
    <button id="play">出撃</button>
    <div class="hint">左スティックで移動 / URLを共有すれば一緒に遊べます</div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
